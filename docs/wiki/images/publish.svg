<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Publishing a skill, then importing it</title><desc>publish ; import. Your library's newest approved version of a skill goes through the secret and path checks, then is written to skills/NAME in your clone with its README row, and committed with a Treadle-Version trailer. You push it yourself. A friend's heedle imports it from the repository, pinned to the commit, and it waits for their review if it asks for connectors. publish ; import is the identity on the skill's files, modes and description.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><rect class="d" x="60" y="60" width="600" height="220" rx="12"/><text class="l" x="64" y="50">your heedle: publish (Library.Publish)</text><path class="w" d="M360 20 L360 80"/><text class="l" x="370" y="44">NAME: its newest approved version</text><g class="c"><rect x="250" y="80" width="220" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="360" y="98" text-anchor="middle" dominant-baseline="central">check</text><text class="t2" x="360" y="118" text-anchor="middle" dominant-baseline="central">no secret, no link, inside its folder</text></g><path class="w" d="M360 136 L360 170"/><g class="p"><rect x="230" y="170" width="260" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="360" y="188" text-anchor="middle" dominant-baseline="central">write ; commit (git)</text><text class="t2" x="360" y="208" text-anchor="middle" dominant-baseline="central">skills/NAME/ ⊗ its README row</text></g><path class="w" d="M360 226 L360 330"/><text class="l" x="370" y="262">a commit with Treadle-Version: VERSION</text><text class="l" x="370" y="300">you push it (heedle never does)</text><rect class="d" x="60" y="330" width="600" height="170" rx="12"/><text class="l" x="64" y="322">a friend's heedle: import (Library.Import)</text><g class="n"><rect x="230" y="350" width="260" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="360" y="368" text-anchor="middle" dominant-baseline="central">fetch (git), pinned</text><text class="t2" x="360" y="388" text-anchor="middle" dominant-baseline="central">the commit seen, or nothing</text></g><path class="w" d="M360 406 L360 430"/><g class="g"><rect x="230" y="430" width="260" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="360" y="448" text-anchor="middle" dominant-baseline="central">review, if it asks for connectors</text><text class="t2" x="360" y="468" text-anchor="middle" dominant-baseline="central">or from a repository not trusted</text></g><path class="w" d="M360 486 L360 540"/><text class="l" x="370" y="522">the same files, modes and description</text><text class="f" x="64" y="548">publish ; import = id</text></svg>
